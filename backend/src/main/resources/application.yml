# Configuración común a todos los perfiles. Los valores de conexión vienen de application-<perfil>.yml.
spring:
  application:
    name: avicontrol-modulo3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo crea Flyway, nunca Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  kafka:
    consumer:
      group-id: avicontrol-modulo3
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual
    producer:
      acks: all

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Tópicos Kafka (arquitectura general, sección "Integración con Módulo 1 y Módulo 2")
kafka:
  topicos:
    m1-galpones: avicontrol.m1.galpones
    m1-alertas-vaciado: avicontrol.m1.alertas-vaciado
    m2-resultados-sacrificio: avicontrol.m2.resultados-sacrificio
    m2-partidas-alimento: avicontrol.m2.partidas-alimento
    m2-consumos-medicamento: avicontrol.m2.consumos-medicamento
    m3-avisos-utilizacion: avicontrol.m3.avisos-utilizacion
    m3-dlt: avicontrol.m3.dlt

sync:
  umbral-inactividad: PT24H # RT-09: fuente desactualizada si no hay sincronización exitosa en este lapso
  m1:
    intervalo: ${SYNC_M1_INTERVALO:PT5M} # cada cuánto se consulta a Módulo 1
    retraso-inicial: PT10S # espera tras arrancar antes de la primera consulta
  m2:
    intervalo: ${SYNC_M2_INTERVALO:PT5M} # cada cuánto se consulta a Módulo 2
    retraso-inicial: PT30S # después de M1: M2 solo se consulta por los lotes que M1 ya trajo

# Módulo 1 (REST de solo lectura). Sin M1_BASE_URL no se sincroniza. Ejemplo: http://18.227.58.143/api/v1
m1:
  base-url: ${M1_BASE_URL:}
  timeout-conexion: PT2S
  timeout-lectura: PT5S

# Módulo 2 (REST de la integración con M3; M2 autoriza por IP de salida, sin usuario ni clave).
# Sin M2_BASE_URL no se consulta ni se confirma. Ejemplo: https://3.21.155.197/api/integracion/modulo3
m2:
  base-url: ${M2_BASE_URL:}
  timeout-conexion: PT2S
  timeout-lectura: PT5S

avisos:
  intervalo: PT1M # frecuencia de envío a M2 de los avisos de utilización pendientes
  retraso-inicial: PT45S

cors:
  origenes-permitidos: ${CORS_ORIGENES:http://localhost:5173} # separados por coma
