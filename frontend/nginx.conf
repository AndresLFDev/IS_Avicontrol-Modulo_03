server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # El backend vive en la red interna de Docker y no se expone al exterior.
  location /api/ {
    proxy_pass http://backend:8080;
    # $http_host conserva el puerto. Con $host el backend vería "localhost" mientras el navegador envía
    # Origin "http://localhost:8081", lo tomaría por una petición de otro origen y rechazaría los POST (403).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Los archivos compilados llevan un hash en el nombre, así que se pueden guardar mucho tiempo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # React Router: cualquier otra ruta devuelve index.html para que la resuelva el navegador.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
