# Despliegue de AviControl M3: PostgreSQL + backend + frontend (nginx) en una sola máquina.
# No incluye Kafka: M3 consulta por REST a M1 y M2, y el aviso de utilización a M2 también va por REST.
#
#   cp .env.prod.example .env.prod      (y completar DB_PASSWORD)
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
#
# Solo el frontend publica un puerto (WEB_PORT, por defecto 80). PostgreSQL y el backend quedan
# en la red interna de Docker. nginx reenvía /api al backend, así que el navegador usa un único origen.
name: avicontrol-m3-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-avicontrol}
      POSTGRES_USER: ${DB_USER:-avicontrol}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env.prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-avicontrol}
      DB_USER: ${DB_USER:-avicontrol}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env.prod}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      # Módulo 1 (REST de solo lectura). Sin M1_BASE_URL el backend no sincroniza con M1.
      M1_BASE_URL: ${M1_BASE_URL:-}
      SYNC_M1_INTERVALO: ${SYNC_M1_INTERVALO:-PT5M}
      # Módulo 2 (REST de integración con M3, autorizado por IP). Sin M2_BASE_URL no consulta ni confirma.
      M2_BASE_URL: ${M2_BASE_URL:-}
      SYNC_M2_INTERVALO: ${SYNC_M2_INTERVALO:-PT5M}
      # Flyway: por defecto solo el esquema. Para cargar los datos de demostración, ver .env.prod.example.
      SPRING_FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      SPRING_FLYWAY_OUT_OF_ORDER: ${FLYWAY_OUT_OF_ORDER:-false}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    mem_limit: 900m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    mem_limit: 64m

volumes:
  postgres-data:
